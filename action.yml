name: AI Review Action
description: Review Pull Requests using OpenAI

inputs:
  github-token:
    description: GitHub Token
    required: true

  openai-api-key:
    description: OpenAI API Key
    required: true

  github-bot-login:
    description: GitHub bot login
    required: true

  prompt-path:
    description: Path to prompt directory
    required: false
    default: ".github/prompts"

  exclude-files:
    description: Comma or newline separated glob patterns for files to exclude from review
    required: false
    default: ""

  model:
    description: OpenAI model
    required: false
    default: "gpt-5.5"

runs:
  using: node24
  main: dist/index.js
